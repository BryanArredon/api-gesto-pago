# Servidor (Render inyecta PORT; local cae en 8080)
server.port=${PORT:8080}
server.shutdown=graceful

# Actuator / Observabilidad (Prometheus consume desde qa/)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Conexión a Base de Datos (credenciales desde .env)
# En Render: no se define SPRING_DATASOURCE_URL, se compone con PGHOST/PGPORT/PGDATABASE + SSL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:dev_bryan}?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.cloud.config.enabled=false

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Esquema de base de datos
spring.flyway.schemas=gestor_pagos
spring.jpa.properties.hibernate.default_schema=${spring.flyway.schemas}

# API GestoPago (valores desde .env)
gestopago.auth.url=${GESTOPAGO_AUTH_URL}
gestopago.auth.id-distribuidor=${GESTOPAGO_AUTH_ID_DISTRIBUIDOR}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_AUTH_CODIGO_DISPOSITIVO}
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD}

# Pagos contra GestoPago
gestopago.unidad=${GESTOPAGO_UNIDAD:083}
gestopago.confirm-wait-seconds=${GESTOPAGO_CONFIRM_WAIT_SECONDS:62}

# Redis (cache y rate limiting)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# Catalogo (cache de productos activos)
catalogo.redis.key=${CATALOGO_REDIS_KEY:catalogo:productos:activos}

# Seguridad / JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
security.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}
security.jwt.issuer=prueba-servicios

# CORS (origenes explicitos separados por coma, nunca *)
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Rate limiting
security.rate-limit.login.max=${RATE_LIMIT_LOGIN_MAX:5}
security.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
security.rate-limit.api.max=${RATE_LIMIT_API_MAX:100}
security.rate-limit.api.window-seconds=${RATE_LIMIT_API_WINDOW_SECONDS:60}

# Usuario administrador inicial (se crea si no existe)
security.admin.email=${ADMIN_EMAIL:}
security.admin.password=${ADMIN_PASSWORD:}
security.admin.nombre=${ADMIN_NOMBRE:Administrador}